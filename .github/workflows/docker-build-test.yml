name: Docker Build Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Build ingest-validator-service first (priority service with disk space issues)
  build-ingest-validator:
    name: Build Ingest Validator Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aggressive disk space cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unnecessary packages ==="
          # Remove .NET
          sudo rm -rf /usr/share/dotnet
          # Remove Android SDK
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android
          # Remove GHC (Haskell)
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          # Remove CodeQL
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # Remove large tool caches
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          # Remove Azure CLI
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /opt/az
          # Remove Google Cloud SDK
          sudo rm -rf /usr/lib/google-cloud-sdk
          # Remove Firefox and Chrome
          sudo apt-get remove -y '^firefox.*' '^google-chrome.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          # Remove Mono
          sudo rm -rf /usr/share/dotnet/sdk
          sudo rm -rf /usr/share/swift
          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          # Clean Docker
          sudo docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check disk space before build
        run: |
          echo "=== Disk space before build ==="
          df -h

      - name: Build ingest-validator-service
        run: |
          echo "Building ingest-validator-service..."
          docker compose build --no-cache ingest-validator-service
        env:
          DOCKER_BUILDKIT: 1

      - name: Check disk space after build
        if: always()
        run: |
          echo "=== Disk space after build ==="
          df -h

      - name: Verify image was created
        run: |
          docker images | grep ingest-validator-service || exit 1

      - name: Clean up
        if: always()
        run: |
          echo "=== Cleaning up ==="
          docker rmi $(docker images -q ingest-validator-service) || true
          docker image prune -af
          docker builder prune -af
          docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

  # Build canonicalizer-normalizer-service second (priority service with disk space issues)
  build-canonicalizer:
    name: Build Canonicalizer Normalizer Service
    runs-on: ubuntu-latest
    needs: build-ingest-validator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aggressive disk space cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unnecessary packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo apt-get remove -y '^firefox.*' '^google-chrome.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet/sdk
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check disk space before build
        run: |
          echo "=== Disk space before build ==="
          df -h

      - name: Build canonicalizer-normalizer-service
        run: |
          echo "Building canonicalizer-normalizer-service..."
          docker compose build --no-cache canonicalizer-normalizer-service
        env:
          DOCKER_BUILDKIT: 1

      - name: Check disk space after build
        if: always()
        run: |
          echo "=== Disk space after build ==="
          df -h

      - name: Verify image was created
        run: |
          docker images | grep canonicalizer-normalizer-service || exit 1

      - name: Clean up
        if: always()
        run: |
          echo "=== Cleaning up ==="
          docker rmi $(docker images -q canonicalizer-normalizer-service) || true
          docker image prune -af
          docker builder prune -af
          docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

  # Build remaining services sequentially
  build-other-services:
    name: Build Other Services
    runs-on: ubuntu-latest
    needs: build-canonicalizer
    strategy:
      fail-fast: false
      max-parallel: 1  # Build one at a time
      matrix:
        service:
          - crawler-service
          - ner-entity-linking-service
          - embedding-service
          - clustering-semantic-grouping-service
          - feature-engineering-service
          - labeler-ground-truth-ingest-service
          - trainer-model-registry-service
          - neo4j-loader-graph-service
          - predictor-online-inference-service
          - api-analytics-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aggressive disk space cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unnecessary packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo apt-get remove -y '^firefox.*' '^google-chrome.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet/sdk
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check disk space before build
        run: |
          echo "=== Disk space before build ==="
          df -h

      - name: Build ${{ matrix.service }}
        run: |
          echo "Building ${{ matrix.service }}..."
          docker compose build --no-cache ${{ matrix.service }}
        env:
          DOCKER_BUILDKIT: 1

      - name: Check disk space after build
        if: always()
        run: |
          echo "=== Disk space after build ==="
          df -h

      - name: Verify image was created
        run: |
          docker images | grep ${{ matrix.service }} || exit 1

      - name: Clean up
        if: always()
        run: |
          echo "=== Cleaning up ==="
          docker rmi $(docker images -q ${{ matrix.service }}) || true
          docker image prune -af
          docker builder prune -af
          docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-ingest-validator, build-canonicalizer, build-other-services]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "All service builds completed!"
          echo "Check individual job results above."

