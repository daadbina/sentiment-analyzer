name: Docker Build and Push

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Detect which services changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      crawler: ${{ steps.filter.outputs.crawler }}
      ingest-validator: ${{ steps.filter.outputs.ingest-validator }}
      canonicalizer: ${{ steps.filter.outputs.canonicalizer }}
      ner: ${{ steps.filter.outputs.ner }}
      embedding: ${{ steps.filter.outputs.embedding }}
      clustering: ${{ steps.filter.outputs.clustering }}
      feature-engineering: ${{ steps.filter.outputs.feature-engineering }}
      labeler: ${{ steps.filter.outputs.labeler }}
      trainer: ${{ steps.filter.outputs.trainer }}
      neo4j-loader: ${{ steps.filter.outputs.neo4j-loader }}
      predictor: ${{ steps.filter.outputs.predictor }}
      api-analytics: ${{ steps.filter.outputs.api-analytics }}
      any-service-changed: ${{ steps.check.outputs.any-changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for service changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.event.after }}
          filters: |
            crawler:
              - 'crawler-service/**'
            ingest-validator:
              - 'ingest-validator-service/**'
            canonicalizer:
              - 'canonicalizer-normalizer-service/**'
            ner:
              - 'ner-entity-linking-service/**'
            embedding:
              - 'embedding-service/**'
            clustering:
              - 'clustering-semantic-grouping-service/**'
            feature-engineering:
              - 'feature-engineering-service/**'
            labeler:
              - 'labeler-ground-truth-ingest-service/**'
            trainer:
              - 'trainer-model-registry-service/**'
            neo4j-loader:
              - 'neo4j-loader-graph-service/**'
            predictor:
              - 'predictor-online-inference-service/**'
            api-analytics:
              - 'api-analytics-service/**'

      - name: Check if any service changed
        id: check
        run: |
          if [[ "${{ steps.filter.outputs.crawler }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.ingest-validator }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.canonicalizer }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.ner }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.embedding }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.clustering }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.feature-engineering }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.labeler }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.trainer }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.neo4j-loader }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.predictor }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.api-analytics }}" == "true" ]]; then
            echo "any-changed=true" >> $GITHUB_OUTPUT
          else
            echo "any-changed=false" >> $GITHUB_OUTPUT
          fi

  # Build ingest-validator-service first (priority service with disk space issues)
  build-ingest-validator:
    name: Build Ingest Validator Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ingest-validator == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aggressive disk space cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unnecessary packages ==="
          # Remove .NET
          sudo rm -rf /usr/share/dotnet
          # Remove Android SDK
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android
          # Remove GHC (Haskell)
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          # Remove CodeQL
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          # Remove large tool caches
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          # Remove Azure CLI
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /opt/az
          # Remove Google Cloud SDK
          sudo rm -rf /usr/lib/google-cloud-sdk
          # Remove Firefox and Chrome
          sudo apt-get remove -y '^firefox.*' '^google-chrome.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          # Remove Mono
          sudo rm -rf /usr/share/dotnet/sdk
          sudo rm -rf /usr/share/swift
          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          # Clean Docker
          sudo docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ingest-validator-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Check disk space before build
        run: |
          echo "=== Disk space before build ==="
          df -h

      - name: Build and push ingest-validator-service
        uses: docker/build-push-action@v5
        with:
          context: ./ingest-validator-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check disk space after build
        if: always()
        run: |
          echo "=== Disk space after build ==="
          df -h

      - name: Clean up
        if: always()
        run: |
          echo "=== Cleaning up ==="
          docker image prune -af
          docker builder prune -af
          docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

  # Build canonicalizer-normalizer-service second (priority service with disk space issues)
  build-canonicalizer:
    name: Build Canonicalizer Normalizer Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-ingest-validator]
    if: |
      always() &&
      needs.detect-changes.outputs.canonicalizer == 'true' &&
      (needs.build-ingest-validator.result == 'success' || needs.build-ingest-validator.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aggressive disk space cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unnecessary packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo apt-get remove -y '^firefox.*' '^google-chrome.*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet/sdk
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/canonicalizer-normalizer-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Check disk space before build
        run: |
          echo "=== Disk space before build ==="
          df -h

      - name: Build and push canonicalizer-normalizer-service
        uses: docker/build-push-action@v5
        with:
          context: ./canonicalizer-normalizer-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check disk space after build
        if: always()
        run: |
          echo "=== Disk space after build ==="
          df -h

      - name: Clean up
        if: always()
        run: |
          echo "=== Cleaning up ==="
          docker image prune -af
          docker builder prune -af
          docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

  # Build crawler-service
  build-crawler:
    name: Build Crawler Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-canonicalizer]
    if: |
      always() &&
      needs.detect-changes.outputs.crawler == 'true' &&
      (needs.build-canonicalizer.result == 'success' || needs.build-canonicalizer.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Aggressive disk space cleanup
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crawler-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push crawler-service
        uses: docker/build-push-action@v5
        with:
          context: ./crawler-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up
        if: always()
        run: |
          docker image prune -af
          docker builder prune -af
          docker system prune -af --volumes

  # Build NER service
  build-ner:
    name: Build NER Entity Linking Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-crawler]
    if: |
      always() &&
      needs.detect-changes.outputs.ner == 'true' &&
      (needs.build-crawler.result == 'success' || needs.build-crawler.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ner-entity-linking-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./ner-entity-linking-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build embedding service
  build-embedding:
    name: Build Embedding Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-ner]
    if: |
      always() &&
      needs.detect-changes.outputs.embedding == 'true' &&
      (needs.build-ner.result == 'success' || needs.build-ner.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/embedding-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./embedding-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build clustering service
  build-clustering:
    name: Build Clustering Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-embedding]
    if: |
      always() &&
      needs.detect-changes.outputs.clustering == 'true' &&
      (needs.build-embedding.result == 'success' || needs.build-embedding.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/clustering-semantic-grouping-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./clustering-semantic-grouping-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build feature-engineering service
  build-feature-engineering:
    name: Build Feature Engineering Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-clustering]
    if: |
      always() &&
      needs.detect-changes.outputs.feature-engineering == 'true' &&
      (needs.build-clustering.result == 'success' || needs.build-clustering.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/feature-engineering-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./feature-engineering-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build labeler service
  build-labeler:
    name: Build Labeler Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-feature-engineering]
    if: |
      always() &&
      needs.detect-changes.outputs.labeler == 'true' &&
      (needs.build-feature-engineering.result == 'success' || needs.build-feature-engineering.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/labeler-ground-truth-ingest-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./labeler-ground-truth-ingest-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build trainer service
  build-trainer:
    name: Build Trainer Model Registry Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-labeler]
    if: |
      always() &&
      needs.detect-changes.outputs.trainer == 'true' &&
      (needs.build-labeler.result == 'success' || needs.build-labeler.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/trainer-model-registry-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./trainer-model-registry-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build neo4j-loader service
  build-neo4j-loader:
    name: Build Neo4j Loader Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-trainer]
    if: |
      always() &&
      needs.detect-changes.outputs.neo4j-loader == 'true' &&
      (needs.build-trainer.result == 'success' || needs.build-trainer.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/neo4j-loader-graph-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./neo4j-loader-graph-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build predictor service
  build-predictor:
    name: Build Predictor Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-neo4j-loader]
    if: |
      always() &&
      needs.detect-changes.outputs.predictor == 'true' &&
      (needs.build-neo4j-loader.result == 'success' || needs.build-neo4j-loader.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/predictor-online-inference-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./predictor-online-inference-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build api-analytics service
  build-api-analytics:
    name: Build API Analytics Service
    runs-on: ubuntu-latest
    needs: [detect-changes, build-predictor]
    if: |
      always() &&
      needs.detect-changes.outputs.api-analytics == 'true' &&
      (needs.build-predictor.result == 'success' || needs.build-predictor.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && sudo docker system prune -af --volumes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-analytics-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: ./api-analytics-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [
      detect-changes,
      build-ingest-validator,
      build-canonicalizer,
      build-crawler,
      build-ner,
      build-embedding,
      build-clustering,
      build-feature-engineering,
      build-labeler,
      build-trainer,
      build-neo4j-loader,
      build-predictor,
      build-api-analytics
    ]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "=== Build Summary ==="
          echo "All service builds completed!"
          echo "Changed services were built and pushed to registry."
          echo "Unchanged services were skipped."
          echo ""
          echo "Check individual job results above for details."

  # Integration Tests
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-summary]

    steps:
      - name: Free up disk space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          echo "=== Cleaning up disk space ==="
          docker system prune -af --volumes
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get clean
          echo "=== After Cleanup ==="
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built images or use latest
        run: |
          echo "Pulling pre-built service images..."
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # Try to pull images with current SHA, fallback to latest
          for service in crawler-service ingest-validator-service canonicalizer-normalizer-service \
                         ner-entity-linking-service embedding-service clustering-semantic-grouping-service \
                         feature-engineering-service labeler-ground-truth-ingest-service trainer-model-registry-service \
                         neo4j-loader-graph-service predictor-online-inference-service api-analytics-service; do
            echo "Pulling $service..."
            if ! docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${BRANCH_NAME}-${{ github.sha }}; then
              echo "SHA-tagged image not found, trying latest..."
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:latest || \
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${BRANCH_NAME} || \
              echo "Warning: Could not pull ${service}, will try to build locally"
            fi
          done

          echo "Images pulled successfully"

      - name: Create .env file for Docker
        run: |
          cat > .env.docker << EOF
          KAFKA_BROKERS=kafka:29092
          SCHEMA_REGISTRY_URL=http://schema-registry:8081
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=sentiment_analysis
          POSTGRES_USER=adminsentiment
          POSTGRES_PASSWORD=wp2400!!!!
          REDIS_HOST=redis
          REDIS_PORT=6379
          QDRANT_HOST=qdrant
          QDRANT_PORT=6333
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=password
          S3_ENDPOINT_URL=http://minio:9000
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          MLFLOW_TRACKING_URI=http://mlflow:5000
          EOF

      - name: Start infrastructure services
        run: |
          echo "Starting infrastructure services..."
          docker compose up -d zookeeper kafka schema-registry postgres minio redis qdrant neo4j mlflow prometheus
          echo "Waiting for infrastructure to be ready..."
          sleep 60

      - name: Verify infrastructure health
        run: |
          echo "=== Verifying Infrastructure Health ==="

          # Check Kafka
          echo "Checking Kafka..."
          docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1

          # Check Schema Registry
          echo "Checking Schema Registry..."
          curl -f http://localhost:8081/subjects || exit 1

          # Check PostgreSQL
          echo "Checking PostgreSQL..."
          docker compose exec -T postgres pg_isready -U adminsentiment || exit 1

          # Check Redis
          echo "Checking Redis..."
          docker compose exec -T redis redis-cli ping || exit 1

          # Check Qdrant
          echo "Checking Qdrant..."
          curl -f http://localhost:6333/healthz || exit 1

          # Check Neo4j
          echo "Checking Neo4j..."
          curl -f http://localhost:7474/ || exit 1

          # Check MinIO
          echo "Checking MinIO..."
          curl -f http://localhost:9000/minio/health/live || exit 1

          # Check MLflow
          echo "Checking MLflow..."
          curl -f http://localhost:5000/ || echo "MLflow may not be ready yet"

          echo "All infrastructure services are healthy!"

      - name: Start microservices sequentially
        run: |
          echo "Starting microservices in order..."

          # Start services one by one with health checks
          services=(
            "crawler-service:8000"
            "ingest-validator-service:8001"
            "canonicalizer-normalizer-service:8002"
            "ner-entity-linking-service:8003"
            "embedding-service:8004"
            "clustering-semantic-grouping-service:8005"
            "feature-engineering-service:8006"
            "labeler-ground-truth-ingest-service:8007"
            "trainer-model-registry-service:8008"
            "neo4j-loader-graph-service:8009"
            "predictor-online-inference-service:8010"
            "api-analytics-service:8011"
          )

          for service_port in "${services[@]}"; do
            service="${service_port%%:*}"
            port="${service_port##*:}"

            echo "Starting $service..."
            docker compose up -d $service

            echo "Waiting for $service to be ready..."
            for i in {1..30}; do
              if curl -f http://localhost:$port/health 2>/dev/null; then
                echo "$service is ready!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
          done

          echo "All microservices started!"

      - name: Test service health endpoints
        run: |
          echo "=== Testing Service Health Endpoints ==="

          curl -f http://localhost:8000/health || exit 1  # crawler
          curl -f http://localhost:8001/health || exit 1  # ingest-validator
          curl -f http://localhost:8002/health || exit 1  # canonicalizer
          curl -f http://localhost:8003/health || exit 1  # ner
          curl -f http://localhost:8004/health || exit 1  # embedding
          curl -f http://localhost:8005/health || exit 1  # clustering
          curl -f http://localhost:8006/health || exit 1  # feature-engineering
          curl -f http://localhost:8007/health || exit 1  # labeler
          curl -f http://localhost:8008/health || exit 1  # trainer
          curl -f http://localhost:8009/health || exit 1  # neo4j-loader
          curl -f http://localhost:8010/health || exit 1  # predictor
          curl -f http://localhost:8011/health || exit 1  # api-analytics

          echo "All health endpoints responding!"

      - name: Test Prometheus metrics endpoints
        run: |
          echo "=== Testing Prometheus Metrics ==="

          curl -f http://localhost:9101/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9102/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9103/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9104/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9105/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9106/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9107/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9108/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9109/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9110/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9111/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9112/metrics | grep -q "python_info" || exit 1

          echo "All metrics endpoints responding!"

      - name: Show service logs
        if: always()
        run: |
          echo "=== Service Logs (last 50 lines each) ==="
          docker compose logs --tail=50 crawler-service
          docker compose logs --tail=50 ingest-validator-service
          docker compose logs --tail=50 canonicalizer-normalizer-service
          docker compose logs --tail=50 ner-entity-linking-service
          docker compose logs --tail=50 embedding-service
          docker compose logs --tail=50 clustering-semantic-grouping-service
          docker compose logs --tail=50 feature-engineering-service
          docker compose logs --tail=50 labeler-ground-truth-ingest-service
          docker compose logs --tail=50 trainer-model-registry-service
          docker compose logs --tail=50 neo4j-loader-graph-service
          docker compose logs --tail=50 predictor-online-inference-service
          docker compose logs --tail=50 api-analytics-service

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker compose down -v
          docker system prune -af --volumes

