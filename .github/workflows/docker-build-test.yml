name: Docker Build Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-services:
    name: Build Docker Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue building other services even if one fails
      matrix:
        service:
          - crawler-service
          - ingest-validator-service
          - canonicalizer-normalizer-service
          - ner-entity-linking-service
          - embedding-service
          - clustering-semantic-grouping-service
          - feature-engineering-service
          - labeler-ground-truth-ingest-service
          - trainer-model-registry-service
          - neo4j-loader-graph-service
          - predictor-online-inference-service
          - api-analytics-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove unnecessary packages and files
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check disk space before build
        run: |
          echo "Disk space before build:"
          df -h
      
      - name: Build ${{ matrix.service }}
        run: |
          echo "Building ${{ matrix.service }}..."
          docker compose build --no-cache ${{ matrix.service }}
        env:
          DOCKER_BUILDKIT: 1
      
      - name: Check disk space after build
        if: always()
        run: |
          echo "Disk space after build:"
          df -h
      
      - name: Verify image was created
        run: |
          docker images | grep ${{ matrix.service }} || exit 1
      
      - name: Clean up
        if: always()
        run: |
          # Remove the built image to free space for other builds
          docker rmi $(docker images -q ${{ matrix.service }}) || true
          docker image prune -af
          docker builder prune -af --filter until=1h
          docker system prune -af --volumes

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-services
    if: always()
    
    steps:
      - name: Check build results
        run: |
          echo "All service builds completed!"
          echo "Check individual job results above."

