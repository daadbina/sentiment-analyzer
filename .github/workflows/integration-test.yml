name: Integration Tests

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types:
      - completed
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/workflows/**'
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file for Docker
        run: |
          cp .env.docker .env
          echo "Created .env file from .env.docker"

      - name: Pull pre-built images or use latest
        run: |
          echo "Pulling pre-built service images..."
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # Try to pull images with current SHA, fallback to latest
          for service in crawler-service ingest-validator-service canonicalizer-normalizer-service \
                         ner-entity-linking-service embedding-service clustering-semantic-grouping-service \
                         feature-engineering-service labeler-ground-truth-ingest-service trainer-model-registry-service \
                         neo4j-loader-graph-service predictor-online-inference-service api-analytics-service; do
            echo "Pulling $service..."
            if ! docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${BRANCH_NAME}-${{ github.sha }}; then
              echo "SHA-tagged image not found, trying latest..."
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:latest || \
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${service}:${BRANCH_NAME} || \
              echo "Warning: Could not pull ${service}, will try to build locally"
            fi
          done

          echo "Images pulled successfully"

      - name: Start infrastructure services
        run: |
          echo "Starting infrastructure services..."
          docker compose up -d zookeeper kafka schema-registry postgres minio redis qdrant neo4j mlflow feast-server prometheus
          echo "Waiting for infrastructure to be ready..."
          sleep 60

      - name: Verify infrastructure health
        run: |
          echo "=== Checking Infrastructure Health ==="
          
          # Check Kafka
          echo "Checking Kafka..."
          docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
          
          # Check Schema Registry
          echo "Checking Schema Registry..."
          curl -f http://localhost:8081/subjects || exit 1
          
          # Check PostgreSQL
          echo "Checking PostgreSQL..."
          docker compose exec -T postgres pg_isready -U adminsentiment || exit 1
          
          # Check Redis
          echo "Checking Redis..."
          docker compose exec -T redis redis-cli ping || exit 1
          
          # Check Qdrant
          echo "Checking Qdrant..."
          curl -f http://localhost:6333/healthz || exit 1
          
          # Check Neo4j
          echo "Checking Neo4j..."
          curl -f http://localhost:7474 || exit 1
          
          # Check MinIO
          echo "Checking MinIO..."
          curl -f http://localhost:9000/minio/health/live || exit 1
          
          # Check MLflow
          echo "Checking MLflow..."
          curl -f http://localhost:5000/health || exit 1
          
          echo "All infrastructure services are healthy!"

      - name: Start microservices sequentially
        run: |
          echo "Starting microservices in order..."
          
          # Start crawler-service
          echo "Starting crawler-service..."
          docker compose up -d crawler-service
          sleep 10
          
          # Start ingest-validator-service
          echo "Starting ingest-validator-service..."
          docker compose up -d ingest-validator-service
          sleep 10
          
          # Start canonicalizer-normalizer-service
          echo "Starting canonicalizer-normalizer-service..."
          docker compose up -d canonicalizer-normalizer-service
          sleep 10
          
          # Start ner-entity-linking-service
          echo "Starting ner-entity-linking-service..."
          docker compose up -d ner-entity-linking-service
          sleep 10
          
          # Start embedding-service
          echo "Starting embedding-service..."
          docker compose up -d embedding-service
          sleep 10
          
          # Start clustering-semantic-grouping-service
          echo "Starting clustering-semantic-grouping-service..."
          docker compose up -d clustering-semantic-grouping-service
          sleep 10
          
          # Start feature-engineering-service
          echo "Starting feature-engineering-service..."
          docker compose up -d feature-engineering-service
          sleep 10
          
          # Start labeler-ground-truth-ingest-service
          echo "Starting labeler-ground-truth-ingest-service..."
          docker compose up -d labeler-ground-truth-ingest-service
          sleep 10
          
          # Start trainer-model-registry-service
          echo "Starting trainer-model-registry-service..."
          docker compose up -d trainer-model-registry-service
          sleep 10
          
          # Start neo4j-loader-graph-service
          echo "Starting neo4j-loader-graph-service..."
          docker compose up -d neo4j-loader-graph-service
          sleep 10
          
          # Start predictor-online-inference-service
          echo "Starting predictor-online-inference-service..."
          docker compose up -d predictor-online-inference-service
          sleep 10
          
          # Start api-analytics-service
          echo "Starting api-analytics-service..."
          docker compose up -d api-analytics-service
          sleep 10
          
          echo "All microservices started!"

      - name: Wait for services to be ready
        run: |
          echo "Waiting for all services to be ready..."
          sleep 60
          echo "Services should be ready now"

      - name: Test service health endpoints
        run: |
          echo "=== Testing Service Health Endpoints ==="
          
          # Test crawler-service
          echo "Testing crawler-service..."
          curl -f http://localhost:8000/health || exit 1
          
          # Test ingest-validator-service
          echo "Testing ingest-validator-service..."
          curl -f http://localhost:8001/health || exit 1
          
          # Test canonicalizer-normalizer-service
          echo "Testing canonicalizer-normalizer-service..."
          curl -f http://localhost:8002/health || exit 1
          
          # Test ner-entity-linking-service
          echo "Testing ner-entity-linking-service..."
          curl -f http://localhost:8003/health || exit 1
          
          # Test embedding-service
          echo "Testing embedding-service..."
          curl -f http://localhost:8004/health || exit 1
          
          # Test clustering-semantic-grouping-service
          echo "Testing clustering-semantic-grouping-service..."
          curl -f http://localhost:8005/health || exit 1
          
          # Test feature-engineering-service
          echo "Testing feature-engineering-service..."
          curl -f http://localhost:8006/health || exit 1
          
          # Test labeler-ground-truth-ingest-service
          echo "Testing labeler-ground-truth-ingest-service..."
          curl -f http://localhost:8007/health || exit 1
          
          # Test trainer-model-registry-service
          echo "Testing trainer-model-registry-service..."
          curl -f http://localhost:8008/health || exit 1
          
          # Test neo4j-loader-graph-service
          echo "Testing neo4j-loader-graph-service..."
          curl -f http://localhost:8009/health || exit 1
          
          # Test predictor-online-inference-service
          echo "Testing predictor-online-inference-service..."
          curl -f http://localhost:8010/health || exit 1
          
          # Test api-analytics-service
          echo "Testing api-analytics-service..."
          curl -f http://localhost:8011/health || exit 1
          
          echo "All service health checks passed!"

      - name: Test Prometheus metrics endpoints
        run: |
          echo "=== Testing Prometheus Metrics Endpoints ==="
          
          curl -f http://localhost:9101/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9102/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9103/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9104/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9105/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9106/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9107/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9108/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9109/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9110/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9111/metrics | grep -q "python_info" || exit 1
          curl -f http://localhost:9112/metrics | grep -q "python_info" || exit 1
          
          echo "All Prometheus metrics endpoints are working!"

      - name: Test Kafka topics
        run: |
          echo "=== Testing Kafka Topics ==="

          # List all topics
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list

          # Check if required topics exist
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "news_raw" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "news_validated" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "news_canonical" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "entities_extracted" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "embeddings" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "semantic_groups" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "features_computed" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "labeled_groups" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "models_trained" || exit 1
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list | grep -q "predictions" || exit 1

          echo "All required Kafka topics exist!"

      - name: Test Schema Registry schemas
        run: |
          echo "=== Testing Schema Registry Schemas ==="

          # List all subjects
          curl -s http://localhost:8081/subjects | jq .

          # Check if schemas are registered
          SUBJECTS=$(curl -s http://localhost:8081/subjects | jq -r '.[]')
          echo "Registered schemas: $SUBJECTS"

          echo "Schema Registry is working!"

      - name: Test PostgreSQL database
        run: |
          echo "=== Testing PostgreSQL Database ==="

          # Check if database exists
          docker compose exec -T postgres psql -U adminsentiment -d sentiment_analyzer -c "\dt" || exit 1

          # List all tables
          docker compose exec -T postgres psql -U adminsentiment -d sentiment_analyzer -c "\dt"

          echo "PostgreSQL database is accessible!"

      - name: Test Redis connectivity
        run: |
          echo "=== Testing Redis Connectivity ==="

          # Test Redis commands
          docker compose exec -T redis redis-cli SET test_key "test_value"
          docker compose exec -T redis redis-cli GET test_key | grep -q "test_value" || exit 1
          docker compose exec -T redis redis-cli DEL test_key

          echo "Redis is working!"

      - name: Test Qdrant collections
        run: |
          echo "=== Testing Qdrant Collections ==="

          # List collections
          curl -s http://localhost:6333/collections | jq .

          # Check if news_embeddings_v1 collection exists
          curl -s http://localhost:6333/collections/news_embeddings_v1 || echo "Collection not yet created (expected on first run)"

          echo "Qdrant is accessible!"

      - name: Test Neo4j connectivity
        run: |
          echo "=== Testing Neo4j Connectivity ==="

          # Check Neo4j status
          curl -f http://localhost:7474 || exit 1

          echo "Neo4j is accessible!"

      - name: Test MinIO buckets
        run: |
          echo "=== Testing MinIO Buckets ==="

          # Install mc (MinIO Client)
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc

          # Configure mc
          ./mc alias set myminio http://localhost:9000 minioadmin minioadmin123

          # List buckets
          ./mc ls myminio

          # Check if sentiment-analyzer bucket exists
          ./mc ls myminio/sentiment-analyzer || echo "Bucket not yet created (expected on first run)"

          echo "MinIO is working!"

      - name: Test MLflow tracking
        run: |
          echo "=== Testing MLflow Tracking ==="

          # Check MLflow experiments
          curl -s http://localhost:5000/api/2.0/mlflow/experiments/list | jq .

          echo "MLflow is accessible!"

      - name: Show service logs
        if: always()
        run: |
          echo "=== Service Logs ==="
          docker compose logs --tail=50 crawler-service
          docker compose logs --tail=50 ingest-validator-service
          docker compose logs --tail=50 canonicalizer-normalizer-service
          docker compose logs --tail=50 ner-entity-linking-service
          docker compose logs --tail=50 embedding-service
          docker compose logs --tail=50 clustering-semantic-grouping-service
          docker compose logs --tail=50 feature-engineering-service
          docker compose logs --tail=50 labeler-ground-truth-ingest-service
          docker compose logs --tail=50 trainer-model-registry-service
          docker compose logs --tail=50 neo4j-loader-graph-service
          docker compose logs --tail=50 predictor-online-inference-service
          docker compose logs --tail=50 api-analytics-service

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker compose down -v
          docker system prune -af --volumes
