version: '3.8'

services:
  api-analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-analytics-service
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL
      POSTGRES_HOST: ${POSTGRES_HOST:-154.53.166.231}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-adminsentiment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wp2400!!!!}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-sentiment}
      
      # Neo4j
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      
      # Cache
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      
      # Rate Limiting
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-1000}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      
      # API
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_WORKERS: ${API_WORKERS:-4}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      
      # Monitoring
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9111}
    
    depends_on:
      - postgres
      - neo4j
      - redis
    
    networks:
      - sentiment-analyzer
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adminsentiment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wp2400!!!!}
      POSTGRES_DB: ${POSTGRES_DATABASE:-sentiment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentiment-analyzer
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
    networks:
      - sentiment-analyzer
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentiment-analyzer
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:

networks:
  sentiment-analyzer:
    driver: bridge

