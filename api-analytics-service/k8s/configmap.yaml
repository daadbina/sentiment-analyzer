apiVersion: v1
kind: ConfigMap
metadata:
  name: api-analytics-config
  namespace: sentiment-analyzer
data:
  postgres_host: "postgres.sentiment-analyzer.svc.cluster.local"
  postgres_port: "5432"
  postgres_database: "sentiment"
  neo4j_uri: "bolt://neo4j.sentiment-analyzer.svc.cluster.local:7687"
  redis_host: "redis.sentiment-analyzer.svc.cluster.local"
  redis_port: "6379"
  jwt_algorithm: "HS256"
  jwt_expiration_hours: "24"
  cache_ttl_seconds: "3600"
  rate_limit_requests: "1000"
  rate_limit_window_seconds: "60"

