apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-analytics-service
  namespace: sentiment-analyzer
  labels:
    app: api-analytics-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-analytics-service
  template:
    metadata:
      labels:
        app: api-analytics-service
        version: v1
    spec:
      serviceAccountName: api-analytics-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: api-analytics-service
        image: sentiment-analyzer/api-analytics-service:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9111
          protocol: TCP
        
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: postgres_host
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: postgres_port
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: api-analytics-secrets
              key: postgres_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-analytics-secrets
              key: postgres_password
        - name: POSTGRES_DATABASE
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: postgres_database
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: neo4j_uri
        - name: NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: api-analytics-secrets
              key: neo4j_user
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-analytics-secrets
              key: neo4j_password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: redis_host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: redis_port
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-analytics-secrets
              key: jwt_secret_key
        - name: JWT_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: jwt_algorithm
        - name: JWT_EXPIRATION_HOURS
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: jwt_expiration_hours
        - name: CACHE_TTL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: cache_ttl_seconds
        - name: RATE_LIMIT_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: rate_limit_requests
        - name: RATE_LIMIT_WINDOW_SECONDS
          valueFrom:
            configMapKeyRef:
              name: api-analytics-config
              key: rate_limit_window_seconds
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: API_WORKERS
          value: "4"
        - name: API_LOG_LEVEL
          value: "INFO"
        - name: PROMETHEUS_PORT
          value: "9111"
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-analytics-service
              topologyKey: kubernetes.io/hostname

