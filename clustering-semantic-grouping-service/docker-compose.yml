version: '3.8'

services:
  clustering-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clustering-semantic-grouping-service
    ports:
      - "8082:8082"
      - "9104:9104"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - KAFKA_BROKERS=154.53.166.231:9092
      - SCHEMA_REGISTRY_URL=http://154.53.166.231:8081
      - KAFKA_INPUT_TOPIC=embeddings
      - KAFKA_OUTPUT_TOPIC=semantic_groups
      - KAFKA_CONSUMER_GROUP=clustering-service-group
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=news_embeddings_v1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=adminsentiment
      - POSTGRES_PASSWORD=wp2400!!!!
      - POSTGRES_DB=sentiment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLUSTERING_ALGORITHM=hdbscan
      - MIN_CLUSTER_SIZE=3
      - SIMILARITY_THRESHOLD=0.85
      - EXECUTION_FREQUENCY_HOURS=4
      - API_HOST=0.0.0.0
      - API_PORT=8082
      - PROMETHEUS_PORT=9104
    depends_on:
      - qdrant
      - postgres
      - redis
    networks:
      - sentiment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-clustering
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sentiment-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres-clustering
    environment:
      - POSTGRES_USER=adminsentiment
      - POSTGRES_PASSWORD=wp2400!!!!
      - POSTGRES_DB=sentiment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentiment-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-clustering
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentiment-network
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  redis_data:

networks:
  sentiment-network:
    driver: bridge

