apiVersion: v1
kind: Service
metadata:
  name: clustering-semantic-grouping-service
  namespace: sentiment-analyzer
  labels:
    app: clustering-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
  - name: metrics
    port: 9104
    targetPort: 9104
    protocol: TCP
  selector:
    app: clustering-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clustering-service
  namespace: sentiment-analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clustering-service
  namespace: sentiment-analyzer
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clustering-service
  namespace: sentiment-analyzer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clustering-service
subjects:
- kind: ServiceAccount
  name: clustering-service
  namespace: sentiment-analyzer

