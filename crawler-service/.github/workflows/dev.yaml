name: Development - Continuous Integration

on:
  push:
    branches:
      - develop
    paths:
      - 'crawler-service/**'
      - '.github/workflows/dev.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/crawler-service

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd crawler-service
          pip install -r requirements.txt
      
      - name: Run ruff linter
        run: |
          cd crawler-service
          python -m ruff check . --select=E,W,F
      
      - name: Run ruff formatter check
        run: |
          cd crawler-service
          python -m ruff format . --check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd crawler-service
          pip install -r requirements.txt
      
      - name: Run all tests
        run: |
          cd crawler-service
          python -m pytest tests/ -v --cov=src --cov-report=xml
      
      - name: Check coverage
        run: |
          cd crawler-service
          python -m pytest tests/ --cov=src --cov-fail-under=90
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./crawler-service/coverage.xml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=develop-latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./crawler-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      
      - name: Lint Helm chart
        run: |
          cd crawler-service
          helm lint helm/crawler-service/
      
      - name: Template Helm chart
        run: |
          cd crawler-service
          helm template crawler-service helm/crawler-service/ > /tmp/manifests.yaml

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, helm-lint]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Deploy with Helm
        run: |
          cd crawler-service
          helm upgrade --install crawler-service helm/crawler-service/ \
            --namespace crawler-service \
            --create-namespace \
            --values helm/crawler-service/values.yaml \
            --set image.tag=develop-latest \
            --set replicaCount=1 \
            --set config.logLevel=DEBUG \
            --wait \
            --timeout 5m
      
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/crawler-service -n crawler-service --timeout=5m
          kubectl get pods -n crawler-service

