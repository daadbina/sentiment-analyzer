name: Main Branch - Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'crawler-service/**'
      - '.github/workflows/main.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/crawler-service

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: ./crawler-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd crawler-service
          pip install -r requirements.txt
      
      - name: Run all tests
        run: |
          cd crawler-service
          python -m pytest tests/ -v --cov=src --cov-fail-under=90
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./crawler-service/coverage.xml

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      
      - name: Lint Helm chart
        run: |
          cd crawler-service
          helm lint helm/crawler-service/
      
      - name: Template Helm chart
        run: |
          cd crawler-service
          helm template crawler-service helm/crawler-service/ > /tmp/manifests.yaml
      
      - name: Validate Kubernetes manifests
        run: |
          cd crawler-service
          helm template crawler-service helm/crawler-service/ | kubectl apply --dry-run=client -f -

  kustomize-lint:
    name: Kustomize Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      
      - name: Validate Kustomize base
        run: |
          cd crawler-service
          kustomize build k8s/base/ > /tmp/base-manifests.yaml
      
      - name: Validate Kustomize overlays
        run: |
          cd crawler-service
          kustomize build k8s/overlays/dev/ > /tmp/dev-manifests.yaml
          kustomize build k8s/overlays/staging/ > /tmp/staging-manifests.yaml
          kustomize build k8s/overlays/prod/ > /tmp/prod-manifests.yaml

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test, helm-lint, kustomize-lint]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Deploy with Helm
        run: |
          cd crawler-service
          helm upgrade --install crawler-service helm/crawler-service/ \
            --namespace crawler-service \
            --create-namespace \
            --values helm/crawler-service/values.yaml \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m
      
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/crawler-service -n crawler-service --timeout=5m
          kubectl get pods -n crawler-service

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Run smoke tests
        run: |
          cd crawler-service
          kubectl port-forward -n crawler-service svc/crawler-service 9101:9101 &
          sleep 5
          curl -f http://localhost:9101/live || exit 1
          curl -f http://localhost:9101/ready || exit 1
          curl -f http://localhost:9101/metrics || exit 1

