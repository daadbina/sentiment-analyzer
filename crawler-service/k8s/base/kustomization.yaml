apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crawler-service

resources:
- namespace.yaml
- configmap.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
- pdb.yaml
- network-policy.yaml

commonLabels:
  app: crawler-service
  managed-by: kustomize

commonAnnotations:
  description: "Crawler Service - Multilingual news article crawler"
  version: "1.0.0"

images:
- name: crawler-service
  newName: crawler-service
  newTag: latest

replicas:
- name: crawler-service
  count: 3

