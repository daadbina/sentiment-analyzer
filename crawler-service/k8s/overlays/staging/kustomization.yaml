apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../base

namespace: crawler-service

namePrefix: staging-

commonLabels:
  environment: staging

commonAnnotations:
  environment: staging

replicas:
- name: crawler-service
  count: 2

images:
- name: crawler-service
  newTag: "1.0.0-staging"

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: crawler-config
  behavior: merge
  literals:
  - LOG_LEVEL=DEBUG
  - ENVIRONMENT=staging
  - CRAWL_INTERVAL_MINUTES=30
  - MAX_CONCURRENT_REQUESTS=50

secretGenerator:
- name: crawler-secrets
  behavior: merge
  envs:
  - secrets.env

