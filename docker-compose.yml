version: '3.8'

# Optimized for slow internet with multi-stage builds and layer caching

networks:
  sentiment-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  # Infrastructure volumes
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  postgres_data:
  minio_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  mlflow_data:
  mlflow_postgres_data:
  prometheus_data:
  grafana_data:
  jaeger_data:
  loki_data:
  # Delta Lake volumes
  delta_lake_data:
  # Model cache volumes
  model_cache:

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # Zookeeper - Required for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: sentiment-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.2

  # Kafka - Message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: sentiment-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.3

  # Schema Registry - Avro schema management
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    container_name: sentiment-schema-registry
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: zookeeper:2181
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_DEBUG: "false"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.4

  # PostgreSQL - Main database
  postgres:
    image: postgres:15-alpine
    container_name: sentiment-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sentiment_analyzer
      POSTGRES_USER: adminsentiment
      POSTGRES_PASSWORD: wp2400!!!!
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminsentiment -d sentiment_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.5

  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: sentiment-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_DOMAIN: minio
      MINIO_REGION_NAME: us-east-1
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.6

  # MinIO Client - Create bucket on startup
  minio-client:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: sentiment-minio-client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/sentiment-analyzer --ignore-existing;
      /usr/bin/mc anonymous set download myminio/sentiment-analyzer;
      exit 0;
      "
    networks:
      - sentiment-network

  # Redis - Caching and feature store online storage
  redis:
    image: redis:7-alpine
    container_name: sentiment-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.20

  # Qdrant - Vector database for embeddings
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sentiment-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.21

  # Neo4j - Graph database
  neo4j:
    image: neo4j:5.15-community
    container_name: sentiment-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/sentiment_password_2024
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2g
      - NEO4J_dbms_memory_pagecache_size=1g
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "sentiment_password_2024", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.22

  # MLflow PostgreSQL backend
  mlflow-postgres:
    image: postgres:15-alpine
    container_name: sentiment-mlflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mlflow
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow_password_2024
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.23

  # MLflow - Model registry and tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: sentiment-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
      - model_cache:/models
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow_password_2024@mlflow-postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow_password_2024@mlflow-postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.24

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: sentiment-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.30

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: sentiment-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_password_2024
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.31

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: sentiment-jaeger
    restart: unless-stopped
    ports:
      - "5775:5775/udp"  # Zipkin compact
      - "6831:6831/udp"  # Jaeger compact
      - "6832:6832/udp"  # Jaeger binary
      - "5778:5778"      # Serve configs
      - "16686:16686"    # UI
      - "14268:14268"    # Jaeger collector
      - "14250:14250"    # gRPC
      - "9411:9411"      # Zipkin
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.32

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: sentiment-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sentiment-network:
        ipv4_address: 172.25.0.33

  # ============================================================================
  # MICROSERVICES
  # ============================================================================

  # 1. Crawler Service (Python 3.13)
  crawler-service:
    build:
      context: ./crawler-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-crawler
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9101:9101"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=crawler-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
    volumes:
      - ./crawler-service/src:/app/src:ro
      - delta_lake_data:/data/delta_lake
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:9101/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentiment-network

  # 2. Ingest Validator Service (Python 3.11)
  ingest-validator-service:
    build:
      context: ./ingest-validator-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-ingest-validator
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "9102:9102"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=ingest-validator-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - POSTGRES_HOST=postgres
    volumes:
      - delta_lake_data:/data/delta_lake
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crawler-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentiment-network

  # 3. Canonicalizer Normalizer Service (Python 3.11)
  canonicalizer-normalizer-service:
    build:
      context: ./canonicalizer-normalizer-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-canonicalizer
    restart: unless-stopped
    ports:
      - "8002:8002"
      - "9103:9103"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=canonicalizer-normalizer-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - POSTGRES_HOST=postgres
    volumes:
      - delta_lake_data:/data/delta_lake
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest-validator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentiment-network

  # 4. NER Entity Linking Service (Python 3.11)
  ner-entity-linking-service:
    build:
      context: ./ner-entity-linking-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-ner
    restart: unless-stopped
    ports:
      - "8003:8003"
      - "9104:9104"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=ner-entity-linking-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - POSTGRES_HOST=postgres
    volumes:
      - model_cache:/models
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      canonicalizer-normalizer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sentiment-network

  # 5. Embedding Service (Python 3.11)
  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-embedding
    restart: unless-stopped
    ports:
      - "8004:8004"
      - "9105:9105"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=embedding-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MODEL_DEVICE=cpu
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - POSTGRES_HOST=postgres
    volumes:
      - model_cache:/models
      - delta_lake_data:/data/delta_lake
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ner-entity-linking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sentiment-network

  # 6. Clustering Semantic Grouping Service (Python 3.11)
  clustering-semantic-grouping-service:
    build:
      context: ./clustering-semantic-grouping-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-clustering
    restart: unless-stopped
    ports:
      - "8005:8005"
      - "9106:9106"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=clustering-semantic-grouping-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - POSTGRES_HOST=postgres
    volumes:
      - delta_lake_data:/data/delta_lake
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentiment-network

  # 7. Feature Engineering Service (Python 3.11)
  feature-engineering-service:
    build:
      context: ./feature-engineering-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-feature-engineering
    restart: unless-stopped
    ports:
      - "8006:8006"
      - "9107:9107"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=feature-engineering-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - POSTGRES_HOST=postgres
    volumes:
      - delta_lake_data:/data/delta_lake
      - ./feast:/feast
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clustering-semantic-grouping-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentiment-network

  # 8. Labeler Ground Truth Ingest Service (Python 3.11)
  labeler-ground-truth-ingest-service:
    build:
      context: ./labeler-ground-truth-ingest-service
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: sentiment-labeler
    restart: unless-stopped
    ports:
      - "8007:8007"
      - "9108:9108"
    env_file:
      - .env.docker
    environment:
      - SERVICE_NAME=labeler-ground-truth-ingest-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
