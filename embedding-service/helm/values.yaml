replicaCount: 3

image:
  repository: sentiment-analyzer/embedding-service
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 8000
  metricsPort: 8001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: embedding-service.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - embedding-service
        topologyKey: kubernetes.io/hostname

kafka:
  brokers: "kafka-broker-0.kafka-headless:9092,kafka-broker-1.kafka-headless:9092,kafka-broker-2.kafka-headless:9092"
  schemaRegistryUrl: "http://schema-registry:8081"
  inputTopic: "news_canonical"
  outputTopic: "embeddings"
  consumerGroup: "embedding-service"

qdrant:
  host: "qdrant"
  port: 6333
  collectionName: "embeddings"
  vectorSize: 768

postgres:
  host: "postgres"
  port: 5432
  database: "sentiment"
  minPoolSize: 5
  maxPoolSize: 20
  user: "adminsentiment"
  password: "wp2400!!!!"

redis:
  host: "redis"
  port: 6379
  db: 0
  cacheTtlSeconds: 86400

model:
  device: "cuda"
  batchSizeGpu: 32
  batchSizeCpu: 16
  maxSequenceLength: 512
  poolSize: 5

validation:
  enabled: true
  driftDetectionEnabled: true
  driftSampleSize: 1000
  driftThreshold: 0.05

metrics:
  prometheusPort: 8001
  enabled: true

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

