apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: sentiment-analyzer
  labels:
    app: embedding-service
    version: v0.1.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
        version: v0.1.0
    spec:
      serviceAccountName: embedding-service
      containers:
      - name: embedding-service
        image: sentiment-analyzer/embedding-service:v0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 8001
          protocol: TCP
        env:
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: kafka.brokers
        - name: KAFKA_SCHEMA_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: kafka.schema_registry_url
        - name: QDRANT_HOST
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: qdrant.host
        - name: QDRANT_PORT
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: qdrant.port
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: postgres.host
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: postgres.port
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: embedding-secrets
              key: postgres.user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: embedding-secrets
              key: postgres.password
        - name: MODEL_DEVICE
          valueFrom:
            configMapKeyRef:
              name: embedding-config
              key: model.device
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - embedding-service
              topologyKey: kubernetes.io/hostname

