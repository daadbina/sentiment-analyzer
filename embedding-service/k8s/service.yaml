apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: sentiment-analyzer
  labels:
    app: embedding-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 8001
    targetPort: 8001
    protocol: TCP
  selector:
    app: embedding-service
  sessionAffinity: None

