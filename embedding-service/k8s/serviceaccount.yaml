apiVersion: v1
kind: ServiceAccount
metadata:
  name: embedding-service
  namespace: sentiment-analyzer
  labels:
    app: embedding-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: embedding-service
  namespace: sentiment-analyzer
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: embedding-service
  namespace: sentiment-analyzer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: embedding-service
subjects:
- kind: ServiceAccount
  name: embedding-service
  namespace: sentiment-analyzer

