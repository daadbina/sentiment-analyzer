replicaCount: 3

image:
  repository: sentiment-analyzer/feature-engineering-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9106"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9106
  targetPort: 9106

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - feature-engineering-service
          topologyKey: kubernetes.io/hostname

kafka:
  bootstrapServers: "kafka-broker-0.kafka-headless.sentiment-analyzer.svc.cluster.local:9092"
  consumerGroup: "feature-engineering-group"
  schemaRegistryUrl: "http://schema-registry.sentiment-analyzer.svc.cluster.local:8081"

postgres:
  host: "postgres.sentiment-analyzer.svc.cluster.local"
  port: 5432
  database: "sentiment_db"
  user: "admin"
  password: "wp2400!!!!"

redis:
  host: "redis.sentiment-analyzer.svc.cluster.local"
  port: 6379
  db: 0

feast:
  repoPath: "/app/feast_repo"

monitoring:
  metricsPort: 9106
  logLevel: "INFO"

livenessProbe:
  httpGet:
    path: /metrics
    port: 9106
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /metrics
    port: 9106
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

