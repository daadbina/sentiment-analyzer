apiVersion: v1
kind: Service
metadata:
  name: feature-engineering-service
  namespace: sentiment-analyzer
  labels:
    app: feature-engineering-service
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9106
    targetPort: 9106
    protocol: TCP
  selector:
    app: feature-engineering-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-engineering-service
  namespace: sentiment-analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: feature-engineering-service
  namespace: sentiment-analyzer
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: feature-engineering-service
  namespace: sentiment-analyzer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: feature-engineering-service
subjects:
- kind: ServiceAccount
  name: feature-engineering-service
  namespace: sentiment-analyzer

