apiVersion: v1
kind: ConfigMap
metadata:
  name: ner-config
  namespace: sentiment-analyzer
  labels:
    app: ner-entity-linking-service
data:
  service_name: "ner-entity-linking-service"
  kafka_brokers: "kafka-broker-0.kafka-headless.sentiment-analyzer.svc.cluster.local:9092,kafka-broker-1.kafka-headless.sentiment-analyzer.svc.cluster.local:9092,kafka-broker-2.kafka-headless.sentiment-analyzer.svc.cluster.local:9092"
  consumer_group: "ner-service-group"
  input_topic: "news_canonical"
  output_topic: "entities_extracted"
  postgres_host: "postgres.sentiment-analyzer.svc.cluster.local"
  postgres_port: "5432"
  postgres_database: "sentiment"
  redis_host: "redis.sentiment-analyzer.svc.cluster.local"
  redis_port: "6379"
  log_level: "INFO"
  
  # NER Configuration
  ner_model_cache_size: "5"
  ner_batch_size: "32"
  ner_confidence_threshold: "0.85"
  ner_max_entities_per_article: "100"
  
  # Entity Linking Configuration
  entity_linking_timeout: "30"
  entity_linking_cache_ttl: "2592000"
  entity_linking_confidence_threshold: "0.75"

  # Wikidata Configuration
  wikidata_api_timeout: "30"
  wikidata_max_retries: "3"
  wikidata_retry_delay: "1"

  # DBpedia Configuration
  dbpedia_api_timeout: "30"
  dbpedia_confidence_threshold: "0.5"

  # OpenSanctions Configuration
  opensanctions_api_timeout: "30"
  opensanctions_enabled: "true"
  
  # Database Configuration
  postgres_pool_size: "20"
  postgres_max_overflow: "10"
  postgres_pool_recycle: "3600"
  
  # Redis Configuration
  redis_pool_size: "10"
  redis_max_connections: "50"
  redis_socket_timeout: "5"
  
  # Kafka Configuration
  kafka_poll_timeout_ms: "1000"
  kafka_session_timeout_ms: "30000"
  kafka_heartbeat_interval_ms: "3000"
  kafka_max_poll_records: "100"
  kafka_enable_auto_commit: "false"
  
  # Metrics Configuration
  metrics_port: "9104"
  metrics_enabled: "true"
  
  # Logging Configuration
  log_format: "json"
  log_output: "stdout"

