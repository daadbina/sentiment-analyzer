version: '3.8'

services:
  predictor-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: predictor-online-inference-service
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      KAFKA_CONSUMER_GROUP_ID: "predictor-service"
      KAFKA_INPUT_TOPIC: "semantic_groups"
      KAFKA_OUTPUT_TOPIC: "predictions"
      KAFKA_GROUND_TRUTH_TOPIC: "ground_truth"
      
      # MLflow Configuration
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_MODEL_NAME: "predictor_model"
      MLFLOW_MODEL_VERSION: "v1.0.0"
      MLFLOW_MODEL_STAGE: "Production"
      
      # Feast Configuration
      FEAST_REPO_PATH: "/feast"
      FEAST_ONLINE_STORE_TYPE: "redis"
      FEAST_ONLINE_STORE_HOST: "redis"
      FEAST_ONLINE_STORE_PORT: "6379"
      FEAST_OFFLINE_STORE_TYPE: "delta"
      FEAST_OFFLINE_STORE_PATH: "s3://feast-offline-store"
      
      # Redis Configuration
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      
      # PostgreSQL Configuration
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "sentiment_analyzer"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_PREDICTIONS_TABLE: "predictions"
      POSTGRES_GROUND_TRUTH_TABLE: "ground_truth"
      
      # Inference Configuration
      INFERENCE_BATCH_SIZE: "100"
      INFERENCE_TIMEOUT_SECONDS: "30"
      INFERENCE_CACHE_TTL_SECONDS: "3600"
      INFERENCE_ENABLE_STREAMING: "true"
      INFERENCE_AB_TESTING_ENABLED: "false"
      
      # API Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_WORKERS: "4"
      
      # Monitoring Configuration
      MONITORING_PROMETHEUS_PORT: "9090"
      MONITORING_JAEGER_HOST: "jaeger"
      MONITORING_JAEGER_PORT: "6831"
      MONITORING_LOG_LEVEL: "INFO"
      
      # Validation Configuration
      VALIDATION_FEATURE_FRESHNESS_THRESHOLD_SECONDS: "3600"
      VALIDATION_FEATURE_RECONCILIATION_THRESHOLD: "0.99"
      VALIDATION_LABEL_CONSISTENCY_THRESHOLD: "0.85"
    
    depends_on:
      - redis
      - postgres
      - kafka
    
    networks:
      - predictor-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: predictor-redis
    ports:
      - "6379:6379"
    networks:
      - predictor-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: predictor-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentiment_analyzer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - predictor-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: predictor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - predictor-network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: predictor-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - predictor-network
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: predictor-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - predictor-network
    restart: unless-stopped

networks:
  predictor-network:
    driver: bridge

volumes:
  postgres-data:

