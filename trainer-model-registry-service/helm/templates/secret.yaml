apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trainer-model-registry.fullname" . }}-secrets
  labels:
    {{- include "trainer-model-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

